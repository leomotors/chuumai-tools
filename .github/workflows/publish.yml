name: Publish Release

on:
  push:
    tags:
      - "*@*.*.*"

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      package-path: ${{ steps.package-info.outputs.package-path }}
      package-name: ${{ steps.package-info.outputs.package-name }}
      package-version: ${{ steps.package-info.outputs.package-version }}
      package-major-version: ${{ steps.package-info.outputs.package-major-version }}
      image: ghcr.io/leomotors/${{ steps.package-info.outputs.package-name }}

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Package Info
        id: package-info
        uses: leomotors/release-action@v6
        with:
          mode: get-packages-info
          tag: ${{ github.ref_name }}

      - name: Create Release
        uses: leomotors/release-action@v6
        with:
          mode: release
          tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ steps.package-info.outputs.package-full-name }}
          changelog-file: ${{ steps.package-info.outputs.changelog-path}}

  build:
    name: Build (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ needs.release.outputs.package-path }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ needs.release.outputs.package-name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ needs.release.outputs.package-name }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ needs.release.outputs.package-name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-arch image
    needs:
      - release
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ${{ needs.release.outputs.image }}
      VERSION: ${{ needs.release.outputs.package-version }}
      MAJOR: ${{ needs.release.outputs.package-major-version }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ needs.release.outputs.package-name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [ ${#digests[@]} -ne 2 ]; then
            echo "::error::expected 2 per-arch digests, found ${#digests[@]}"
            exit 1
          fi
          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:v${MAJOR}" \
            --tag "${IMAGE}:latest" \
            "${refs[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
